/* Layout: top bar + left rail (desktop) / bottom tab bar (phone); status chips borrow the look of material status labels. */
:root {
  --bg: #edf1f0;
  --surface: #ffffff;
  --surface-2: #e2e9e7;
  --line: #c9d3d1;
  --fg: #142220;
  --muted: #55625f;
  --accent: #0e6a5d;
  --accent-ink: #ffffff;
  --accent-soft: #d3eae4;
  --ok: #1d7a3b;
  --ok-soft: #dcf0e1;
  --warn: #8a5d00;
  --warn-soft: #f7e8b5;
  --bad: #b3261e;
  --bad-soft: #f8dcd9;
  --shadow: 0 1px 2px rgba(20, 34, 32, .06), 0 6px 20px rgba(20, 34, 32, .06);

  --f-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --f-body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;

  --r: 10px;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1514; --surface: #162120; --surface-2: #1d2a28; --line: #2b3a38;
    --fg: #e3ebe9; --muted: #98a7a4; --accent: #5cc4b1; --accent-ink: #052019; --accent-soft: #15362f;
    --ok: #74d18f; --ok-soft: #173322; --warn: #e6c15a; --warn-soft: #3a3011; --bad: #f28b80; --bad-soft: #3d1c19;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1514; --surface: #162120; --surface-2: #1d2a28; --line: #2b3a38;
  --fg: #e3ebe9; --muted: #98a7a4; --accent: #5cc4b1; --accent-ink: #052019; --accent-soft: #15362f;
  --ok: #74d18f; --ok-soft: #173322; --warn: #e6c15a; --warn-soft: #3a3011; --bad: #f28b80; --bad-soft: #3d1c19;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.55 var(--f-body);
  min-height: 100vh;
}
[hidden] { display: none !important; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { text-wrap: balance; line-height: 1.2; margin: 0; }
h1 { font: 700 clamp(1.5rem, 1.1rem + 1.8vw, 2.2rem)/1.15 var(--f-display); letter-spacing: -.01em; }
h2 { font: 600 1.3rem/1.25 var(--f-body); }
h3 { font: 600 1.05rem/1.3 var(--f-body); }
p { margin: 0; }

.skip { position: absolute; left: -999px; top: 8px; background: var(--surface); padding: 8px 12px; z-index: 50; }
.skip:focus { left: 16px; }

/* Top bar */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 16px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--fg); min-width: 0; }
.brand-mark {
  width: 34px; height: 34px; flex: none; border-radius: 50%;
  background:
    linear-gradient(90deg, transparent 47%, var(--accent-ink) 47% 53%, transparent 53%),
    var(--accent);
  box-shadow: inset 0 -3px 0 rgba(0,0,0,.18);
}
.brand-text { display: flex; flex-direction: column; min-width: 0; }
.brand-text b { font: 700 .95rem/1.1 var(--f-display); }
@media (max-width: 420px) { .brand-text small { display: none; } }
.brand-text small { font: 400 .72rem/1.3 var(--f-mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn {
  display: inline-grid; place-items: center; width: 40px; height: 40px; flex: none;
  border: 1px solid var(--line); border-radius: 50%; background: var(--surface); cursor: pointer;
}
.icon-btn:hover { border-color: var(--accent); }
.top-actions { display: flex; gap: 8px; flex: none; }

/* Shell */
.shell { display: grid; grid-template-columns: 1fr; }
main { min-width: 0; padding: 20px 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px)); outline: none; }
.view-inner { max-width: 880px; margin: 0 auto; display: grid; gap: 22px; }
.view-inner > * { min-width: 0; }

.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(6, minmax(0, 1fr));
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.nav a {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  height: var(--nav-h); text-decoration: none; color: var(--muted);
  font-size: .68rem; font-weight: 500; min-width: 0;
}
.nav a span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-inline: 2px; }
.nav svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.nav a.active { color: var(--accent); }
.nav a.active svg { stroke-width: 2.2; }
.nav a.nav-extra { display: none; }

.foot {
  padding: 18px 16px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px));
  border-top: 1px solid var(--line); color: var(--muted); font-size: .85rem;
}
.foot-in { max-width: 880px; margin: 0 auto; display: grid; gap: 8px; }
.foot strong { color: var(--fg); font-weight: 600; }
.foot-links { display: flex; flex-wrap: wrap; gap: 6px 16px; }
.foot-links a { color: var(--fg); }
.foot-src { font-size: .78rem; }
#shellTop, #shellNav, #shellFoot { display: contents; }

@media (min-width: 960px) {
  .shell { grid-template-columns: 232px 1fr; }
  .nav {
    position: sticky; top: 61px; align-self: start; height: calc(100vh - 61px);
    display: flex; flex-direction: column; gap: 2px;
    padding: 18px 12px; border-top: 0; border-right: 1px solid var(--line); background: transparent;
  }
  .nav a {
    flex-direction: row; justify-content: flex-start; gap: 12px; height: auto;
    padding: 10px 12px; border-radius: 8px; font-size: .95rem; color: var(--fg);
  }
  .nav a.nav-extra { display: flex; }
  .nav a:hover { background: var(--surface-2); }
  .nav a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  main { padding: 32px 32px 48px; }
  .foot { padding: 20px 32px 28px 264px; }
}

/* Generic pieces */
.eyebrow { font: 600 .72rem/1.2 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.lead { color: var(--muted); font-size: 1.02rem; max-width: 62ch; }
.muted { color: var(--muted); }
.stack { display: grid; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; }
.panel.lifted { box-shadow: var(--shadow); }
.num { font-variant-numeric: tabular-nums; font-family: var(--f-mono); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 10px 18px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  font-weight: 600; text-decoration: none; cursor: pointer; transition: border-color .15s, background .15s;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { background: transparent; }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: .9rem; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

/* Status chip — styled like a GMP material label */
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  font: 600 .68rem/1 var(--f-mono); letter-spacing: .07em; text-transform: uppercase;
  padding: 5px 8px; border-radius: 4px; border: 1px solid currentColor; white-space: nowrap;
}
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.ok { color: var(--ok); background: var(--ok-soft); }
.chip.warn { color: var(--warn); background: var(--warn-soft); }
.chip.bad { color: var(--bad); background: var(--bad-soft); }
.chip.idle { color: var(--muted); background: var(--surface-2); border-color: var(--line); }

.bar { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width .4s ease; }

.note {
  border: 1px dashed var(--warn); background: var(--warn-soft); color: var(--fg);
  border-radius: 8px; padding: 12px 14px; font-size: .92rem;
}

/* Home */
.hero { display: grid; gap: 12px; padding-top: 4px; }
.progress-card { display: grid; gap: 16px; }
.progress-top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.big { font: 700 clamp(2.4rem, 2rem + 2vw, 3.4rem)/1 var(--f-display); letter-spacing: -.02em; }
.big small { font-size: .4em; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-left: 4px; }
.cta { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.cta .btn { width: 100%; }
@media (max-width: 560px) { .cta { grid-template-columns: 1fr; } }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { padding: 14px 16px; border-radius: var(--r); background: var(--surface-2); display: grid; gap: 4px; min-width: 0; }
.stat b { font: 600 1.4rem/1.1 var(--f-mono); font-variant-numeric: tabular-nums; }
.stat span { font-size: .82rem; color: var(--muted); }
@media (max-width: 480px) { .stats { grid-template-columns: 1fr; } .stat { grid-template-columns: auto 1fr; align-items: baseline; gap: 12px; } }

/* Module list */
.modules { display: grid; gap: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.module {
  display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 14px; align-items: center;
  padding: 14px 16px; text-decoration: none; color: var(--fg); border-top: 1px solid var(--line);
}
.module:first-child { border-top: 0; }
.module:hover { background: var(--surface-2); }
.module .idx { font: 600 .9rem/1 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.module .t { display: grid; gap: 2px; min-width: 0; }
.module .t b { font-weight: 600; }
.module .t span { font-size: .86rem; color: var(--muted); }
@media (max-width: 560px) {
  .module { grid-template-columns: 32px minmax(0, 1fr); }
  .module .chip { grid-column: 2; justify-self: start; }
}

/* Lesson */
.lesson-head { display: grid; gap: 10px; }
.crumbs { font-size: .86rem; }
.crumbs ol { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px; }
.crumbs li { display: inline-flex; gap: 4px; min-width: 0; }
.crumbs li + li::before { content: "/"; color: var(--muted); }
.crumbs a { text-decoration: none; }
.crumbs [aria-current] { color: var(--muted); }
.prose { display: grid; gap: 14px; max-width: 68ch; }
.prose p { font-size: 1.02rem; }
.section-title { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.section-title .tag { font: 600 .7rem/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; padding: 5px 7px; border-radius: 4px; }
.tag.rules { background: var(--ok-soft); color: var(--ok); }
.tag.errs { background: var(--bad-soft); color: var(--bad); }
.tag.theory { background: var(--accent-soft); color: var(--accent); }
.tag.check { background: var(--warn-soft); color: var(--warn); }
.checklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.checklist li { position: relative; padding-left: 28px; }
.checklist li::before {
  content: ""; position: absolute; left: 0; top: .28em; width: 16px; height: 16px;
  border: 2px solid var(--ok); border-radius: 3px;
}
.checklist li::after {
  content: ""; position: absolute; left: 5px; top: calc(.28em + 2px); width: 5px; height: 9px;
  border: solid var(--ok); border-width: 0 2px 2px 0; transform: rotate(45deg);
}
.errlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.errlist li { position: relative; padding-left: 28px; }
.errlist li::before, .errlist li::after {
  content: ""; position: absolute; left: 1px; top: calc(.28em + 7px); width: 14px; height: 2px; background: var(--bad); transform: rotate(45deg);
}
.errlist li::after { transform: rotate(-45deg); }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 760px) { .two { grid-template-columns: 1fr; } }
.lesson-nav { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; }

/* Questions */
.q { display: grid; gap: 12px; }
.q + .q { border-top: 1px solid var(--line); padding-top: 18px; }
.q-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.q-type { font: 600 .7rem/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.q-text { font-weight: 600; font-size: 1.05rem; }
.opts { display: grid; gap: 8px; }
.opt {
  display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 12px; align-items: start; text-align: left;
  width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
  cursor: pointer; line-height: 1.4;
}
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt .mk { width: 20px; height: 20px; margin-top: 1px; border: 2px solid var(--line); border-radius: 50%; display: grid; place-items: center; }
.opt.multi .mk { border-radius: 4px; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .mk { border-color: var(--accent); background: var(--accent); box-shadow: inset 0 0 0 3px var(--accent-soft); }
.opt.multi.sel .mk { box-shadow: none; }
.opt.multi.sel .mk::after { content: ""; width: 5px; height: 9px; border: solid var(--accent-ink); border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .mk { border-color: var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .mk { border-color: var(--bad); background: var(--bad); box-shadow: none; }
.opt[disabled] { cursor: default; }
.explain { border-radius: 8px; padding: 12px 14px; font-size: .95rem; display: grid; gap: 4px; }
.explain.ok { background: var(--ok-soft); }
.explain.bad { background: var(--bad-soft); }
.explain b { font-family: var(--f-mono); font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; }
.explain.ok b { color: var(--ok); }
.explain.bad b { color: var(--bad); }

/* Tests */
.test-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.test-card { display: grid; gap: 10px; align-content: space-between; padding: 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); min-width: 0; }
.test-card.feature { border-color: var(--accent); }
.test-card p { font-size: .88rem; color: var(--muted); }
.test-card .row { justify-content: space-between; }
.runner-head { display: grid; gap: 10px; }
.runner-head .row { justify-content: space-between; }
.result-score { display: flex; flex-wrap: wrap; gap: 20px; align-items: center; }
.ring { width: 112px; height: 112px; flex: none; }
.ring circle { fill: none; stroke-width: 10; }
.ring .bg { stroke: var(--surface-2); }
.ring .fg { stroke: var(--accent); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }
.ring text { fill: var(--fg); font: 700 22px var(--f-mono); }
.mistake { display: grid; gap: 8px; padding: 14px 0; border-top: 1px solid var(--line); }
.mistake:first-child { border-top: 0; padding-top: 0; }
.mistake .lbl { font: 600 .7rem/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; }
.mistake .yours { color: var(--bad); }
.mistake .right { color: var(--ok); }
.mistake ul { margin: 4px 0 0; padding-left: 18px; }

/* Flashcards */
.fc-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.seg { display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); max-width: 100%; }
.seg button { border: 0; background: transparent; padding: 8px 12px; cursor: pointer; font-size: .88rem; font-weight: 500; min-height: 38px; line-height: 1.25; }
@media (max-width: 560px) { .seg { width: 100%; } .seg button { padding: 8px 6px; font-size: .82rem; } }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.card-stage { perspective: 1200px; }
.flash {
  position: relative; display: grid; width: 100%; min-height: 260px; border: 0; padding: 0; background: none; cursor: pointer; text-align: center;
  transform-style: preserve-3d; transition: transform .45s cubic-bezier(.2,.7,.2,1);
}
.flash.flipped { transform: rotateY(180deg); }
.face {
  grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  display: grid; align-content: center; justify-items: center; gap: 12px; text-align: center;
  padding: 28px 24px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow);
}
.face.back { transform: rotateY(180deg); background: var(--accent-soft); border-color: var(--accent); }
.face .term { font: 700 clamp(1.4rem, 1.1rem + 1.5vw, 2rem)/1.2 var(--f-display); overflow-wrap: anywhere; }
.face .def { display: block; font-size: 1.05rem; max-width: 52ch; }
.face .hint { font: 500 .72rem/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.fc-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fc-actions .no { border-color: var(--bad); color: var(--bad); }
.fc-actions .yes { border-color: var(--ok); color: var(--ok); }
.star {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px; min-height: 36px; padding: 6px 10px;
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: .88rem;
}
.star svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; }
.star[aria-pressed="true"] { color: var(--warn); border-color: var(--warn); background: var(--warn-soft); }
.star[aria-pressed="true"] svg { fill: currentColor; }
@media (prefers-reduced-motion: reduce) { .flash, .bar > i { transition: none; } }

/* Glossary */
.search { position: relative; }
.search input {
  width: 100%; min-height: 48px; padding: 12px 14px 12px 42px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: inherit;
}
.search input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; fill: none; stroke: var(--muted); stroke-width: 2; }
.gl { display: grid; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.gl-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; padding: 14px 16px; border-top: 1px solid var(--line); }
.gl-item:first-child { border-top: 0; }
.gl-item dt { font-weight: 700; }
.gl-item dd { margin: 0; grid-column: 1; color: var(--fg); font-size: .95rem; }
.gl-item .star { grid-row: 1 / span 2; grid-column: 2; align-self: start; }
mark { background: var(--warn-soft); color: inherit; border-radius: 2px; padding: 0 1px; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }

/* Cheat sheet */
.sheet-head { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: flex-end; }
.sheet { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 680px) { .sheet { grid-template-columns: 1fr; } }
.sheet section { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 14px 16px; break-inside: avoid; }
.sheet h3 { font: 600 .78rem/1.2 var(--f-mono); letter-spacing: .07em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
.sheet ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: .92rem; }
.sheet li { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 8px; }
.sheet li::before { content: ""; width: 11px; height: 11px; margin-top: .3em; border: 1.5px solid var(--muted); border-radius: 2px; }
.sheet-foot { font-size: .85rem; color: var(--muted); }
.print-only { display: none; }

/* ---- Добавлено: модуль грануляции, служебные страницы, «Поделиться» ---- */
.view-inner.narrow { max-width: 720px; }
.note.med { border-color: var(--accent); background: var(--accent-soft); }
.pmini { display: grid; gap: 6px; }
.pmini a { color: var(--fg); text-decoration: none; }
.pmini a:hover { color: var(--accent); }
.feature-link {
  display: grid; gap: 4px; padding: 16px 18px; border-radius: var(--r); text-decoration: none; color: var(--fg);
  border: 1px solid var(--accent); background:
    radial-gradient(circle at 92% 30%, var(--accent-soft) 0 18px, transparent 19px),
    radial-gradient(circle at 84% 70%, var(--accent-soft) 0 11px, transparent 12px),
    radial-gradient(circle at 97% 78%, var(--accent-soft) 0 7px, transparent 8px),
    var(--surface);
  padding-right: 92px;
}
.feature-link b { font: 700 1.05rem/1.25 var(--f-display); }
.feature-link span:last-child { color: var(--muted); font-size: .92rem; }
.feature-link:hover { box-shadow: var(--shadow); }
.tag.goals { background: var(--surface-2); color: var(--fg); }
.goallist { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.goallist li::marker { color: var(--accent); }
.stages { list-style: none; counter-reset: st; margin: 18px 0; padding: 0; display: grid; gap: 0; max-width: 72ch; }
.stages li { counter-increment: st; display: grid; grid-template-columns: 40px minmax(0, 1fr); column-gap: 14px; padding: 0 0 18px; position: relative; }
.stages li::before {
  content: counter(st); grid-row: 1 / span 2; width: 32px; height: 32px; border-radius: 50%;
  display: grid; place-items: center; font: 600 .9rem/1 var(--f-mono); background: var(--accent); color: var(--accent-ink);
}
.stages li::after { content: ""; position: absolute; left: 15px; top: 36px; bottom: 4px; width: 2px; background: var(--line); }
.stages li:last-child::after { display: none; }
.stages b { display: block; margin-bottom: 2px; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
.tbl { border-collapse: collapse; width: 100%; min-width: 620px; font-size: .92rem; }
.tbl th, .tbl td { text-align: left; vertical-align: top; padding: 10px 12px; border-top: 1px solid var(--line); }
.tbl thead th { border-top: 0; background: var(--surface-2); font: 600 .72rem/1.3 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.tbl tbody th { font-weight: 600; width: 30%; }
.examples { display: grid; gap: 12px; }
.example { border: 1px dashed var(--line); border-radius: 8px; padding: 12px 14px; background: var(--bg); }
.example h3 { font-size: .95rem; margin-bottom: 6px; }
.example ul { margin: 0; padding-left: 18px; display: grid; gap: 3px; font-family: var(--f-mono); font-size: .86rem; font-variant-numeric: tabular-nums; }
.plain-list { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.h-test { font-size: clamp(1.15rem, 1rem + .8vw, 1.5rem); }
.small-link { font-size: .85rem; }
.prose h2 { margin-top: 6px; }
code { font-family: var(--f-mono); font-size: .88em; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
.author { display: flex; gap: 16px; align-items: center; }
.author-mark {
  width: 64px; height: 64px; flex: none; border-radius: 50%; display: grid; place-items: center;
  font: 700 1.1rem/1 var(--f-display); color: var(--accent-ink); background: var(--accent);
}
.author-name { font-size: 1.1rem; }
.confirm { border: 1px solid var(--bad); background: var(--bad-soft); border-radius: 8px; padding: 14px; display: grid; gap: 10px; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.toast {
  position: fixed; left: 50%; bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px);
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-weight: 600; font-size: .92rem;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 60; max-width: calc(100% - 32px);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.share-box {
  position: fixed; left: 16px; right: 16px; bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px)); z-index: 60;
  max-width: 560px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: var(--shadow); padding: 14px; display: grid; gap: 8px; font-size: .9rem;
}
.share-box input { flex: 1; min-width: 0; min-height: 40px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); font: inherit; }
@media (min-width: 960px) { .toast, .share-box { bottom: 24px; } }
@media (max-width: 420px) { .feature-link { padding-right: 18px; background: var(--surface); } }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

@media print {
  @page { size: A4; margin: 10mm; }
  :root, :root[data-theme="dark"] {
    --bg: #fff; --surface: #fff; --surface-2: #f1f1f1; --line: #999; --fg: #000; --muted: #333; --accent: #000; --accent-soft: #fff;
    color-scheme: light;
  }
  body { background: #fff; color: #000; font-size: 10pt; line-height: 1.35; }
  .top, .nav, .foot, .skip, .no-print, .crumbs, #toast { display: none !important; }
  .shell { display: block; }
  main { padding: 0 !important; }
  .view-inner { max-width: none; gap: 8px; }
  .print-only { display: block; }
  .sheet { grid-template-columns: 1fr 1fr; gap: 6px; }
  .sheet section { padding: 6px 8px; border-radius: 0; }
  .sheet h3 { font-size: 8.5pt; margin-bottom: 3px; }
  .sheet ul { font-size: 8.6pt; gap: 2px; }
  h1 { font-size: 15pt; }
  .lead { font-size: 9pt; }

    else h += '<div class="confirm" role="alert"><p>Удалить весь прогресс, результаты тестов и избранное? Действие нельзя отменить.</p><div class="row"><button type="button" class="btn danger" data-act="clear-yes">Да, удалить</button><button type="button" class="btn ghost" data-act="clear-no">Отмена</button></div></div>';
    h += "<h2>Хостинг</h2>";
    h += "<p>Сайт размещён на бесплатном статическом хостинге. Хостинг-провайдер может вести технические журналы запросов (например, IP-адрес и время обращения) по своим правилам. Автор сайта к этим журналам доступа не имеет и их не использует.</p>";
    h += "<h2>Об авторе</h2>";
    h += "<p>Фамилия, имя, отчество и должность автора указаны по его желанию. Других сведений об авторе и посетителях сайт не публикует и не обрабатывает.</p>";
    return h + "</section></div>";
  }

  function viewNotFound() {
    return '<div class="view-inner"><h1>Страница не найдена</h1><p class="lead"><a href="' + link("home") + '">Вернуться на главную</a></p></div>';
  }

  /* ---------- Рендер по маршруту ---------- */
  function render(r) {
    if (r === "home") return viewHome();
    if (r === "lessons") return viewLessons();
    if (r === "gran") return viewGran();
    if (r.indexOf("lesson-") === 0) return viewLesson(r.slice(7));
    if (r === "tests") return viewTests();
    if (r.indexOf("test-") === 0) return viewTest(r.slice(5));
    if (r === "cards") return viewCards();
    if (r === "glossary") return viewGlossary();
    if (r === "sheet") return viewSheet();
    if (r === "author") return viewAuthor();
    if (r === "privacy") return viewPrivacy();
    return viewNotFound();
  }

  /* ---------- Метаданные страниц (для сборки) ---------- */
  function routes() {
    var r = ["home", "lessons", "gran", "tests", "cards", "glossary", "sheet", "author", "privacy", "test-gran-final"];
    LESSONS.forEach(function (l) { r.push("lesson-" + l.id); });
    return r;
  }
  var BRAND = " | Оператор ТЛФ";
  function withBrand(t) { return (t + BRAND).length <= 60 ? t + BRAND : t; }
  function meta(r) {
    var l = r.indexOf("lesson-") === 0 ? LMAP[r.slice(7)] : null;
    if (l && l.module === "gran") return { title: withBrand(l.seoTitle), description: l.seoDesc, article: true, lesson: l };
    if (l) return { title: withBrand(l.title), description: l.short + " Материалы для самоподготовки оператора ТЛФ.", article: true, lesson: l };
    if (r === "gran") return { title: G.seo.title, description: G.seo.desc, article: true, headline: G.h1, faq: G.faq };
    if (r === "test-gran-final") return { title: G.seo.finalTitle, description: G.seo.finalDesc };
    var M = {
      home: ["Оператор ТЛФ: таблетки, капсулы, грануляция", "Материалы для самоподготовки операторов производства твёрдых лекарственных форм: GMP, грануляция ТЛФ, таблетирование, упаковка, тесты."],
      lessons: ["Основные уроки для оператора ТЛФ", "14 уроков для оператора производства ТЛФ: GMP, гигиена, документация, взвешивание, смешивание, таблетирование, упаковка, отклонения."],
      tests: ["Тесты для самопроверки оператора ТЛФ", "Тесты по урокам и итоговые тесты для операторов производства твёрдых лекарственных форм, включая грануляцию ТЛФ, с объяснением ответов."],
      cards: ["Флеш-карточки терминов GMP и ТЛФ", "Флеш-карточки «термин — определение» по GMP, грануляции ТЛФ и технологии твёрдых лекарственных форм с режимом «знаю / не знаю»."],
      glossary: ["Глоссарий GMP и грануляции ТЛФ", "Термины GMP и производства твёрдых лекарственных форм с поиском: ALCOA+, CAPA, line clearance, импеллер, чоппер, грануляция ТЛФ."],
      sheet: ["Шпаргалка оператора ТЛФ на смену", "Чек-лист оператора производства твёрдых лекарственных форм на одну страницу для печати: записи, контроль, отклонения, безопасность."],
      author: ["Об авторе" + BRAND, "Об авторе материалов для самоподготовки операторов производства твёрдых лекарственных форм."],
      privacy: ["Конфиденциальность" + BRAND, "Сайт не собирает персональные данные. Прогресс хранится только на устройстве пользователя; как его очистить."]
    };
    var m = M[r] || ["Оператор ТЛФ", ""];
    return { title: m[0], description: m[1] };
  }

  /* ---------- Экспорт для сборки ---------- */
  if (IS_NODE) {
    root.TLF_APP = {
      SITE_URL: SITE_URL, AUTHOR_NAME: AUTHOR_NAME, AUTHOR_JOB: AUTHOR_JOB, DISCLAIMER: DISCLAIMER,
      routes: routes, meta: meta, pathFor: pathFor, publicUrl: publicUrl, sectionOf: sectionOf,
      setMode: function (m, rt) { MODE = m; ROOT = rt || ""; },
      page: function (r) { return { header: headerHTML(), nav: navHTML(sectionOf(r)), view: render(r), footer: footerHTML() }; },
      counts: function () { return { lessons: LESSONS.length, base: BASE.length, gran: GRAN.length, questions: BANK.length, gran_q: BANK_GRAN.length, glossary: GLOSSARY.length }; }
    };
    return;
  }

  /* ===================== Браузер ===================== */
  var $view = document.getElementById("view");

  function applyTheme() {
    if (S.theme === "dark" || S.theme === "light") document.documentElement.setAttribute("data-theme", S.theme);
    else document.documentElement.removeAttribute("data-theme");
  }
  function currentTheme() {
    if (S.theme) return S.theme;
    try { return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; } catch (e) { return "light"; }
  }
  applyTheme();

  // В режиме SPA оболочку (шапка, навигация, подвал) рисуем сами
  if (MODE === "spa") {
    document.getElementById("shellTop").innerHTML = headerHTML();
    document.getElementById("shellFoot").innerHTML = footerHTML();
  }

  function currentRoute() {
    if (MODE === "spa") return (location.hash || "#home").slice(1) || "home";
    if (FIXED === "tests") {
      var hsh = location.hash.slice(1);
      if (hsh.indexOf("test-") === 0) return hsh;
    }
    return FIXED;
  }

  var lastRoute = "";
  function route() {
    var r = currentRoute();
    if (r.indexOf("test-") === 0) {
      if (T && T.route !== r) T = null;
      if (T && r !== lastRoute && !T.keep) T = null;
      if (T) T.keep = false;
    }
    if (r !== "privacy") CLEAR_ASK = false;
    $view.innerHTML = render(r);
    if (MODE === "spa") {
      var navBox = document.getElementById("shellNav");
      navBox.innerHTML = navHTML(sectionOf(r));
    }
    var m = meta(r);
    if (MODE === "spa" || r !== FIXED) document.title = r.indexOf("test-") === 0 && T ? T.title + " | Оператор ТЛФ" : m.title;
    if (r !== lastRoute && lastRoute !== "") {
      window.scrollTo(0, 0);
      try { $view.focus({ preventScroll: true }); } catch (e) { /* старые браузеры */ }
    }
    lastRoute = r;
  }
  function rerender() { var y = window.scrollY; route(); window.scrollTo(0, y); }

  function replaceQ(st) {
    var el = $view.querySelector('.q[data-qkey="' + (window.CSS && CSS.escape ? CSS.escape(st.key) : st.key) + '"]');
    if (!el) return rerender();
    var tmp = document.createElement("div");
    tmp.innerHTML = questionHTML(st);
    el.replaceWith(tmp.firstChild);
  }

  /* Поделиться */
  var toastTimer = null;
  function toast(msg) {
    var t = document.getElementById("toast");
    if (!t) { t = document.createElement("div"); t.id = "toast"; t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2600);
  }
  function shareUrl() {
    if (MODE === "mpa") {
      var c = document.querySelector('link[rel="canonical"]');
      var base = c ? c.href : location.href.split("#")[0];
      return location.hash && location.hash.indexOf("#test-") === 0 ? base + location.hash : base;
    }
    return publicUrl(currentRoute());
  }
  function fallbackCopy(url) {
    var box = document.getElementById("shareBox");
    if (!box) {
      box = document.createElement("div"); box.id = "shareBox"; box.className = "share-box";
      box.innerHTML = '<label for="shareInput">Ссылка на страницу</label><div class="row"><input id="shareInput" readonly><button type="button" class="btn small" data-act="share-close">Готово</button></div>';
      document.body.appendChild(box);
      box.addEventListener("click", function (e) { if (e.target.closest('[data-act="share-close"]')) box.remove(); });
    }
    var inp = document.getElementById("shareInput");
    inp.value = url; inp.focus(); inp.select();
  }
  function share() {
    var url = shareUrl(), title = document.title;
    if (navigator.share) {
      navigator.share({ title: title, url: url }).catch(function (err) {
        if (err && err.name === "AbortError") return;
        copyLink(url);
      });
      return;
    }
    copyLink(url);
  }
  function copyLink(url) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () { toast("Ссылка скопирована"); }, function () { fallbackCopy(url); });
    } else fallbackCopy(url);
  }

  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]");
    if (!b) return;
    var act = b.getAttribute("data-act");
    var st;
    switch (act) {
      case "theme":
        S.theme = currentTheme() === "dark" ? "light" : "dark"; applyTheme(); save(); break;
      case "share": share(); break;
      case "opt":
        st = QS[b.getAttribute("data-qkey")]; if (!st) return;
        selectOpt(st, +b.getAttribute("data-opt"));
        if (T && T.items.indexOf(st) !== -1) rerender(); else replaceQ(st);
        break;
      case "check":
        st = QS[b.getAttribute("data-qkey")]; if (!st) return;
        checkQ(st);
        if (T && T.items.indexOf(st) !== -1) rerender(); else replaceQ(st);
        break;
      case "next":
        if (!T) return;
        if (T.i + 1 < T.items.length) T.i++; else finishTest();
        route(); window.scrollTo(0, 0); break;
      case "finish":
        if (T) { finishTest(); route(); window.scrollTo(0, 0); } break;
      case "restart":
        if (!T) return;
        var tid = T.id, ids = tid === "retry" ? T.items.map(function (x) { return x.q.id; }) : null, title = tid === "retry" ? T.title : null;
        var keepRoute = T.route;
        startTest(tid, ids, title); T.route = keepRoute; route(); window.scrollTo(0, 0); break;
      case "retry-wrong":
        if (!T) return;
        var wids = T.items.filter(function (x) { return !x.ok; }).map(function (x) { return x.q.id; });
        var here = currentRoute();
        startTest("retry", wids, "Повтор ошибок: " + T.title.replace(/^Повтор ошибок: /, ""));
        T.keep = true;
        if (MODE === "mpa" && FIXED !== "tests") {
          // итоговый тест модуля живёт на своей странице: повторяем ошибки прямо здесь
          T.route = here; route(); window.scrollTo(0, 0);
        } else {
          T.route = "test-retry";
          if (location.hash === "#test-retry") { route(); window.scrollTo(0, 0); } else location.hash = "#test-retry";
        }
        break;
      case "toggle-done":
        var id = b.getAttribute("data-id");
        if (S.done[id]) delete S.done[id]; else S.done[id] = 1;
        save(); rerender(); break;
      case "fav":
        var term = b.getAttribute("data-term");
        if (S.fav[term]) delete S.fav[term]; else S.fav[term] = 1;
        save();
        if (currentRoute() === "glossary") {
          var on = !!S.fav[term];
          b.setAttribute("aria-pressed", on);
          b.setAttribute("aria-label", (on ? "Убрать из избранного" : "В избранное") + ": " + term);
        } else rerender();
        break;
      case "flip": FC.flipped = !FC.flipped; b.classList.toggle("flipped", FC.flipped); break;
      case "fc-yes":
      case "fc-no":
        var g = FC.deck[FC.i]; if (!g) return;
        S.known[g.term] = act === "fc-yes" ? 1 : 0;
        FC.stats[act === "fc-yes" ? "yes" : "no"]++;
        save(); FC.i++; FC.flipped = false; rerender(); break;
      case "fc-mode": FC.mode = b.getAttribute("data-mode"); buildDeck(); rerender(); break;
      case "fc-dir": FC.dir = b.getAttribute("data-dir"); FC.flipped = false; rerender(); break;
      case "fc-restart": buildDeck(); rerender(); break;
      case "print": try { window.print(); } catch (err) { /* печать недоступна */ } break;
      case "clear-ask": CLEAR_ASK = true; rerender(); break;
      case "clear-no": CLEAR_ASK = false; rerender(); break;
      case "clear-yes":
        clearState(); CLEAR_ASK = false; FC.deck = null; T = null;
        Object.keys(QS).forEach(function (k) { delete QS[k]; });
        applyTheme(); rerender(); toast("Прогресс удалён"); break;
    }
  });

  document.addEventListener("input", function (e) {
    if (e.target.id === "glSearch") {
      GQ = e.target.value;
      var list = document.getElementById("glList");
      if (list) list.innerHTML = glossaryListHTML();
    }
  });
  document.addEventListener("keydown", function (e) {
    if (currentRoute() !== "cards" || e.target.tagName === "INPUT") return;
    if (e.key === "ArrowRight" && FC.flipped) { var y = $view.querySelector('[data-act="fc-yes"]'); if (y) y.click(); }
    if (e.key === "ArrowLeft" && FC.flipped) { var n = $view.querySelector('[data-act="fc-no"]'); if (n) n.click(); }
  });

  window.addEventListener("hashchange", function () {
    if (MODE === "spa" || FIXED === "tests") route();
  });
  route();
})(typeof window !== "undefined" ? window : globalThis);
</script>
</body>
</html>
